<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="stylesheet" href="%sveltekit.assets%/tokens.css" />
    <!-- Theme before first paint, so a dark reviewer never sees a light flash.
         Same rule as src/lib/theme.svelte.ts: the stored choice, else the OS;
         the surfaces that show the light-only app stay light. -->
    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('ndo-ds-theme');
          if (s === 'light' || s === 'dark') t = s;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        } catch (e) {}
        var p = location.pathname;
        if (/\/(app|patterns|playbook|ui-kit|scenarios)(\/|$)/.test(p) || /\/guidelines\/[^/]+/.test(p)) t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- The ndo-* custom-element bundle is NOT loaded here. It carries its own
         copy of the Svelte runtime, and loading it on every page put two
         runtimes on the prototype, which it has no use for — it renders the
         app's components, not the custom elements. The playbook, which does
         demo them, loads it from its own layout. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
  </body>
</html>
